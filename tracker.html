<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ルーティン">
<title>今日のルーティン</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23378ADD'/%3E%3Cpath d='M30 50 L45 65 L70 35' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#FAF9F5; --card:#FFFFFF; --bg-sec:#F0EEE6; --bg-ter:#E5E2D6;
    --text:#1F1E1B; --text-sec:#5F5E5A; --text-ter:#8B8A85;
    --border:#D9D6CC; --border-sec:#BFBCB0; --border-ter:#EAE7DC;
    --radius-md:8px; --radius-lg:12px;
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    --accent:#378ADD;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1A1A19; --card:#222220; --bg-sec:#2A2A28; --bg-ter:#33332F;
      --text:#F0EEE6; --text-sec:#B0AEA5; --text-ter:#7A7872;
      --border:#3A3A36; --border-sec:#4A4A45; --border-ter:#2E2E2B;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px}

  /* ===== Auth screen ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-box{background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-lg);padding:28px 24px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.05)}
  .auth-title{font-size:20px;font-weight:600;color:var(--text);text-align:center;margin-bottom:6px}
  .auth-sub{font-size:12px;color:var(--text-sec);text-align:center;margin-bottom:20px}
  .auth-tabs{display:flex;background:var(--bg-sec);border-radius:var(--radius-md);padding:3px;margin-bottom:18px}
  .auth-tab{flex:1;background:none;border:none;padding:8px;font-size:13px;color:var(--text-sec);cursor:pointer;font-family:var(--font);border-radius:6px;transition:all 0.15s}
  .auth-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.06)}
  .auth-input{width:100%;background:var(--bg);border:1px solid var(--border-ter);border-radius:var(--radius-md);padding:11px 13px;font-size:14px;color:var(--text);outline:none;font-family:var(--font);margin-bottom:10px;transition:border 0.15s}
  .auth-input:focus{border-color:var(--border-sec)}
  .auth-submit{width:100%;background:var(--text);color:var(--card);border:none;border-radius:var(--radius-md);padding:11px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);margin-top:6px;transition:opacity 0.15s}
  .auth-submit:hover{opacity:0.85}
  .auth-submit:disabled{opacity:0.5;cursor:not-allowed}
  .auth-msg{font-size:12px;text-align:center;margin-top:12px;min-height:18px}
  .auth-msg.error{color:#C04848}
  .auth-msg.info{color:var(--accent)}

  /* ===== Main app ===== */
  .app-title{font-size:18px;font-weight:600;margin-bottom:14px;color:var(--text);letter-spacing:0.02em;display:flex;align-items:center;justify-content:space-between}
  .sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-ter);font-weight:400}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#888}
  .sync-dot.synced{background:#5CAA40}
  .sync-dot.syncing{background:#E0A040;animation:pulse 1.2s infinite}
  .sync-dot.error{background:#C04848}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;background:var(--bg-sec);border-radius:var(--radius-lg);margin-bottom:14px}
  .leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sec)}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .dot-blue{background:#378ADD} .dot-green{background:#639922} .dot-pink{background:#D4537E}
  .dot-gray{background:#888780} .dot-amber{background:#BA7517} .dot-violet{background:#7C58C7}
  .dot-off{background:var(--border-sec);border:1px solid var(--border)}
  .streak-box{background:var(--bg-sec);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:14px}
  .streak-num{font-size:34px;font-weight:600;color:var(--text);line-height:1;min-width:36px}
  .streak-sub-wrap{display:flex;flex-direction:column;gap:2px;padding-top:5px}
  .streak-title{font-size:13px;color:var(--text)}
  .streak-sub{font-size:11px;color:var(--text-sec)}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .nav-btn{background:none;border:1px solid var(--border-sec);border-radius:var(--radius-md);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text-sec);font-family:var(--font);transition:all 0.15s}
  .nav-btn:hover{background:var(--bg-sec);color:var(--text)}
  .nav-date-btn{background:none;border:1px solid var(--border-sec);border-radius:var(--radius-md);padding:6px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);font-family:var(--font);display:flex;align-items:center;gap:6px;transition:all 0.15s}
  .nav-date-btn:hover{background:var(--bg-sec)}
  .cal-ic{font-size:13px}
  .week-row{display:flex;justify-content:space-between;margin-bottom:14px;gap:4px}
  .week-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;cursor:pointer;padding:2px 0;border-radius:6px;transition:background 0.1s}
  .week-col:hover{background:var(--bg-sec)}
  .week-dow{font-size:11px;color:var(--text-ter)}
  .week-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-ter);transition:all 0.15s}
  .week-num.today{border:1.5px solid var(--text);color:var(--text)}
  .week-num.cur{border:1.5px solid var(--accent);color:var(--accent)}
  .week-num.has{background:var(--bg-ter);color:var(--text-sec)}
  .week-num.all{background:var(--accent);color:#fff;border:none}
  .sec-label{font-size:11px;color:var(--text-ter);margin:14px 0 7px;letter-spacing:0.04em;text-transform:uppercase;font-weight:500}
  .task-card{background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-lg);padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.1s;user-select:none}
  .task-card:hover{background:var(--bg-sec);border-color:var(--border)}
  .task-circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-sec);flex-shrink:0;transition:all 0.15s}
  .done-blue{background:#378ADD;border-color:#378ADD;box-shadow:inset 0 0 0 3px #fff}
  .done-green{background:#639922;border-color:#639922;box-shadow:inset 0 0 0 3px #fff}
  .done-pink{background:#D4537E;border-color:#D4537E;box-shadow:inset 0 0 0 3px #fff}
  .done-gray{background:#888780;border-color:#888780;box-shadow:inset 0 0 0 3px #fff}
  .done-amber{background:#BA7517;border-color:#BA7517;box-shadow:inset 0 0 0 3px #fff}
  .done-violet{background:#7C58C7;border-color:#7C58C7;box-shadow:inset 0 0 0 3px #fff}
  .task-name{flex:1;font-size:13.5px;color:var(--text)}
  .task-name.done{color:var(--text-ter);text-decoration:line-through}
  .task-freq{font-size:11px;color:var(--text-ter);white-space:nowrap}
  .task-del{background:none;border:none;color:var(--text-ter);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;opacity:0.5;transition:opacity 0.15s;border-radius:4px;margin-left:2px}
  .task-del:hover{opacity:1;background:var(--bg-ter)}
  .add-btn{width:100%;background:none;border:1px dashed var(--border-sec);border-radius:var(--radius-lg);padding:11px;color:var(--text-ter);font-size:13px;cursor:pointer;font-family:var(--font);margin-top:6px;transition:all 0.15s}
  .add-btn:hover{background:var(--bg-sec);color:var(--text-sec);border-color:var(--border)}
  .add-form{background:var(--bg-sec);border-radius:var(--radius-lg);padding:14px;margin-top:8px;display:flex;flex-direction:column;gap:12px}
  .at-input{background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-md);padding:10px 12px;font-size:13.5px;color:var(--text);outline:none;font-family:var(--font);width:100%}
  .at-input:focus{border-color:var(--border-sec)}
  .form-label{font-size:11px;color:var(--text-ter);margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase;font-weight:500}
  .freq-row{display:flex;gap:6px;flex-wrap:wrap}
  .freq-btn{background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-md);padding:7px 12px;font-size:12.5px;color:var(--text-sec);cursor:pointer;font-family:var(--font);transition:all 0.15s}
  .freq-btn.active{background:var(--text);color:var(--card);border-color:var(--text)}
  .dow-row{display:flex;gap:5px;margin-top:8px}
  .dow-btn{flex:1;background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-md);padding:7px 0;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:var(--font);transition:all 0.15s}
  .dow-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .color-row{display:flex;gap:8px;flex-wrap:wrap}
  .color-sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s}
  .color-sw.active{border-color:var(--text);box-shadow:0 0 0 1.5px var(--card)}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .cancel-btn,.confirm-btn{border-radius:var(--radius-md);padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--font);transition:all 0.15s}
  .cancel-btn{background:none;border:1px solid var(--border-sec);color:var(--text-sec)}
  .cancel-btn:hover{background:var(--card)}
  .confirm-btn{background:var(--text);color:var(--card);border:1px solid var(--text)}
  .confirm-btn:hover{opacity:0.85}
  .input-row{display:flex;gap:8px}
  .ri{flex:1;background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-lg);padding:11px 13px;font-size:13px;color:var(--text);outline:none;font-family:var(--font);transition:border 0.15s}
  .ri:focus{border-color:var(--border-sec)}
  .rec-btn{background:var(--bg-sec);border:1px solid var(--border-sec);border-radius:var(--radius-md);padding:0 16px;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:var(--font);white-space:nowrap;transition:all 0.15s}
  .rec-btn:hover{background:var(--bg-ter);color:var(--text)}
  .saved-items{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .saved-item{background:var(--bg-sec);border-radius:var(--radius-md);padding:9px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
  .si-text{flex:1;color:var(--text-sec)}
  .del{background:none;border:none;color:var(--text-ter);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
  .del:hover{color:var(--text)}
  .note-toggle{width:100%;background:none;border:none;color:var(--text-ter);font-size:12px;cursor:pointer;padding:14px 0 2px;font-family:var(--font);text-align:center}
  .note-toggle:hover{color:var(--text-sec)}
  .note-area{background:var(--card);border:1px solid var(--border-ter);border-radius:var(--radius-lg);padding:11px 13px;font-size:13px;color:var(--text);width:100%;min-height:80px;resize:vertical;outline:none;font-family:var(--font);margin-top:7px;transition:border 0.15s}
  .note-area:focus{border-color:var(--border-sec)}
  .note-save{margin-top:7px;background:var(--bg-sec);border:1px solid var(--border-sec);border-radius:var(--radius-md);padding:7px 16px;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:var(--font)}
  .note-save:hover{background:var(--bg-ter);color:var(--text)}
  footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--border-ter);font-size:10px;color:var(--text-ter);text-align:center;line-height:1.7}
  footer a{color:var(--text-sec);text-decoration:none;cursor:pointer}
  footer a:hover{text-decoration:underline}
  footer .user-line{margin-bottom:4px}

  .cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .cal-content{background:var(--card);border-radius:var(--radius-lg);padding:18px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,0.2)}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-title{font-size:15px;font-weight:600;color:var(--text)}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-ter);margin-bottom:8px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:6px;cursor:pointer;color:var(--text);transition:all 0.1s}
  .cal-cell:hover{background:var(--bg-sec)}
  .cal-cell.dim{color:var(--text-ter);opacity:0.4}
  .cal-cell.has{background:var(--bg-sec)}
  .cal-cell.all{background:var(--accent);color:#fff}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--text)}
  .cal-cell.cur{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .cal-cell.all.cur{box-shadow:inset 0 0 0 1.5px #fff}
  .cal-foot{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
  .cal-foot button{flex:1;background:var(--bg-sec);border:1px solid var(--border-sec);border-radius:var(--radius-md);padding:8px;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:var(--font)}
  .cal-foot button:hover{background:var(--bg-ter)}
</style>
</head>
<body>

<!-- Auth screen -->
<div class="auth-wrap" id="auth-screen" style="display:none">
  <div class="auth-box">
    <h1 class="auth-title">今日のルーティン</h1>
    <p class="auth-sub">ログインしてiPhoneとPC間で同期</p>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" onclick="setAuthMode('signin')">ログイン</button>
      <button class="auth-tab" id="tab-signup" onclick="setAuthMode('signup')">新規登録</button>
    </div>
    <input type="email" class="auth-input" id="auth-email" placeholder="メールアドレス" autocomplete="email" />
    <input type="password" class="auth-input" id="auth-pw" placeholder="パスワード（6文字以上）" autocomplete="current-password" />
    <button class="auth-submit" id="auth-submit" onclick="doAuth()">ログイン</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- Main app -->
<div class="wrap" id="app-screen" style="display:none">
  <div class="app-title">
    <span>今日のルーティン</span>
    <span class="sync-pill" id="sync-pill"><span class="sync-dot"></span><span id="sync-text">…</span></span>
  </div>

  <div class="legend">
    <div class="leg"><div class="dot dot-blue"></div>英語</div>
    <div class="leg"><div class="dot dot-green"></div>手術</div>
    <div class="leg"><div class="dot dot-pink"></div>NOTE</div>
    <div class="leg"><div class="dot dot-gray"></div>読書</div>
    <div class="leg"><div class="dot dot-amber"></div>論文</div>
    <div class="leg"><div class="dot dot-violet"></div>その他</div>
  </div>

  <div class="streak-box">
    <div class="streak-num" id="snum">0</div>
    <div class="streak-sub-wrap">
      <div class="streak-title">日連続チェック中</div>
      <div class="streak-sub">毎日1つでも入れれば継続</div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn" onclick="cd(-1)">←</button>
    <button class="nav-date-btn" onclick="openCal()"><span id="nd"></span><span class="cal-ic">📅</span></button>
    <button class="nav-btn" onclick="cd(1)">→</button>
  </div>

  <div class="week-row" id="wr"></div>
  <div id="tc"></div>

  <button class="add-btn" id="addToggleBtn" onclick="toggleAddForm()">＋ タスクを追加</button>
  <div id="add-form" class="add-form" style="display:none">
    <input type="text" class="at-input" id="at-name" placeholder="タスク名（例：ストレッチ 10分）" />
    <div>
      <div class="form-label">頻度</div>
      <div class="freq-row" id="at-freq">
        <button class="freq-btn active" data-type="daily" onclick="setFreq('daily')">毎日</button>
        <button class="freq-btn" data-type="weekly" onclick="setFreq('weekly')">特定の曜日</button>
        <button class="freq-btn" data-type="adhoc" onclick="setFreq('adhoc')">随時</button>
      </div>
      <div class="dow-row" id="at-days" style="display:none">
        <button class="dow-btn" data-d="0" onclick="toggleDow(0)">日</button>
        <button class="dow-btn" data-d="1" onclick="toggleDow(1)">月</button>
        <button class="dow-btn" data-d="2" onclick="toggleDow(2)">火</button>
        <button class="dow-btn" data-d="3" onclick="toggleDow(3)">水</button>
        <button class="dow-btn" data-d="4" onclick="toggleDow(4)">木</button>
        <button class="dow-btn" data-d="5" onclick="toggleDow(5)">金</button>
        <button class="dow-btn" data-d="6" onclick="toggleDow(6)">土</button>
      </div>
    </div>
    <div>
      <div class="form-label">色</div>
      <div class="color-row" id="at-colors"></div>
    </div>
    <div class="form-actions">
      <button class="cancel-btn" onclick="toggleAddForm()">キャンセル</button>
      <button class="confirm-btn" onclick="addTask()">追加する</button>
    </div>
  </div>

  <div class="sec-label" style="margin-top:18px">今日の調べもの・イレギュラー</div>
  <div class="input-row">
    <input class="ri" id="ri" placeholder="例：腹腔鏡手術の合併症 調べた" />
    <button class="rec-btn" onclick="saveR()">記録</button>
  </div>
  <div class="saved-items" id="si"></div>

  <button class="note-toggle" id="nt" onclick="toggleN()">＋ 今日のひとこと</button>
  <div id="ns" style="display:none">
    <textarea class="note-area" id="na" placeholder="今日感じたこと、気づきなど…"></textarea>
    <button class="note-save" onclick="saveN()">保存</button>
  </div>

  <footer>
    <div class="user-line">ログイン中: <span id="user-email"></span> ／ <a onclick="signOut()">サインアウト</a></div>
    <a onclick="exportData()">バックアップを書き出す</a> ／ <a onclick="document.getElementById('imp').click()">読み込む</a>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
  </footer>
</div>

<!-- Calendar overlay -->
<div class="cal-overlay" id="cal-overlay" style="display:none" onclick="if(event.target===this)closeCal()">
  <div class="cal-content">
    <div class="cal-header">
      <button class="nav-btn" onclick="calMonth(-1)">←</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="nav-btn" onclick="calMonth(1)">→</button>
    </div>
    <div class="cal-dow-row"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-foot">
      <button onclick="jumpToday()">今日へ</button>
      <button onclick="closeCal()">閉じる</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// === Supabase config ===
const SUPABASE_URL='https://cnwgtyqxtnsohlxxkoel.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNud2d0eXF4dG5zb2hseHhrb2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxOTU2ODgsImV4cCI6MjA5Mzc3MTY4OH0.gn6Da5bTt49jq3KGhT9XJ-TAV3lLfXGXVjLLPhlLxSQ';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true}});

// === Constants ===
const DAILY=[
  {id:'d1',dot:'blue',label:'NEJM Quick Take を1本流す',freq:'毎日'},
  {id:'d2',dot:'blue',label:'シャドーイング（1〜2文声に出す）',freq:'毎日'},
  {id:'d3',dot:'green',label:'毎日できトレ 3分',freq:'毎日',skipThu:true},
  {id:'d4',dot:'gray',label:'読書（30分上限）',freq:'毎日'},
];
const WEEKLY=[
  {id:'w1',dot:'green',label:'手術動画1本（19時〜固定）',freq:'週1'},
  {id:'w2',dot:'pink',label:'NOTE執筆（今週の気づきを1本書く）',freq:'週1'},
];
const ADHOC=[{id:'a1',dot:'amber',label:'論文調査・症例メモ',freq:'随時'}];
const DOW=['日','月','火','水','木','金','土'];
const COLORS=[
  {key:'blue',val:'#378ADD'},{key:'green',val:'#639922'},{key:'pink',val:'#D4537E'},
  {key:'gray',val:'#888780'},{key:'amber',val:'#BA7517'},{key:'violet',val:'#7C58C7'},
];
const STORAGE_KEY='routine-tracker-v1';
const TS_KEY=STORAGE_KEY+'-ts';

const dk=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;};
const builtinDaily=dow=>DAILY.filter(t=>!(t.skipThu&&dow===4));
const customDaily=()=>S.customTasks.filter(t=>t.type==='daily');
const customWeekly=dow=>S.customTasks.filter(t=>t.type==='weekly'&&t.days&&t.days[dow]);
const customAdhoc=()=>S.customTasks.filter(t=>t.type==='adhoc');
const allTasksToday=dow=>[
  ...builtinDaily(dow),...customDaily(),
  ...(dow===4?WEEKLY:[]),...customWeekly(dow),
  ...ADHOC,...customAdhoc()
];

// === State ===
let today=new Date();today.setHours(0,0,0,0);
let cur=new Date(today);
let calCur=new Date(today.getFullYear(),today.getMonth(),1);
let S={checks:{},research:{},notes:{},noteOpen:{},customTasks:[]};
let formType='daily',formDays=[false,false,false,false,false,false,false],formColor='violet';
let currentUser=null;
let pushTimer=null;

function sanitizeS(){
  ['checks','research','notes','noteOpen'].forEach(k=>{if(!S[k])S[k]={};});
  if(!Array.isArray(S.customTasks))S.customTasks=[];
}

function loadLocal(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)S=JSON.parse(raw);}catch(e){console.error(e);}
  sanitizeS();
}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(S));
    localStorage.setItem(TS_KEY,Date.now().toString());
  }catch(e){console.error(e);}
}
function localTs(){return parseInt(localStorage.getItem(TS_KEY)||'0');}

// === Sync ===
function setSync(state){
  const dot=document.querySelector('#sync-pill .sync-dot');
  const txt=document.getElementById('sync-text');
  dot.className='sync-dot '+(state==='synced'?'synced':state==='syncing'?'syncing':state==='error'?'error':'');
  txt.textContent=state==='synced'?'同期済':state==='syncing'?'同期中…':state==='error'?'同期失敗':state==='offline'?'オフライン':'';
}

async function pullFromCloud(){
  if(!currentUser)return;
  setSync('syncing');
  try{
    const {data,error}=await Promise.race([
      sb.from('tracker_data').select('data,updated_at').eq('user_id',currentUser.id).maybeSingle(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))
    ]);
    if(error)throw error;
    if(!data){
      // No remote data, push local up
      await pushToCloudNow();
    }else{
      const remoteTs=new Date(data.updated_at).getTime();
      const lts=localTs();
      // If local is newer, push it; otherwise pull
      if(lts>remoteTs+1000){
        await pushToCloudNow();
      }else{
        S=data.data||{};
        sanitizeS();
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));}catch(e){}
        try{localStorage.setItem(TS_KEY,remoteTs.toString());}catch(e){}
        setSync('synced');
      }
    }
  }catch(e){
    console.error('pull failed',e);
    setSync('error');
  }
}

async function pushToCloudNow(){
  if(!currentUser)return;
  setSync('syncing');
  try{
    const nowIso=new Date().toISOString();
    const {error}=await Promise.race([
      sb.from('tracker_data').upsert({
        user_id:currentUser.id,
        data:S,
        updated_at:nowIso
      },{onConflict:'user_id'}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))
    ]);
    if(error)throw error;
    try{localStorage.setItem(TS_KEY,Date.parse(nowIso).toString());}catch(e){}
    setSync('synced');
  }catch(e){
    console.error('push failed',e);
    setSync('error');
  }
}

function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushToCloudNow,800);
}

function save(){
  saveLocal();
  if(currentUser&&navigator.onLine!==false)schedulePush();
}

// === Auth ===
function setAuthMode(mode){
  document.getElementById('tab-signin').classList.toggle('active',mode==='signin');
  document.getElementById('tab-signup').classList.toggle('active',mode==='signup');
  document.getElementById('auth-submit').textContent=mode==='signin'?'ログイン':'登録する';
  document.getElementById('auth-msg').textContent='';
  document.getElementById('auth-pw').setAttribute('autocomplete',mode==='signin'?'current-password':'new-password');
  document.getElementById('auth-submit').dataset.mode=mode;
}

function showMsg(text,type){
  const el=document.getElementById('auth-msg');
  el.textContent=text;
  el.className='auth-msg '+(type||'');
}

async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pw=document.getElementById('auth-pw').value;
  const mode=document.getElementById('auth-submit').dataset.mode||'signin';
  if(!email||!pw){showMsg('メールとパスワードを入力してください','error');return;}
  const btn=document.getElementById('auth-submit');
  btn.disabled=true;showMsg('処理中…','info');
  try{
    if(mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pw});
      if(error)throw error;
      if(!data.session){showMsg('登録完了！下の「ログイン」タブからログインしてください','info');setAuthMode('signin');}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error)throw error;
    }
  }catch(e){
    showMsg(translateErr(e.message),'error');
  }finally{
    btn.disabled=false;
  }
}

function translateErr(m){
  if(/Invalid login/i.test(m))return 'メールかパスワードが違います';
  if(/already registered/i.test(m))return 'このメールは既に登録済みです';
  if(/at least 6/i.test(m))return 'パスワードは6文字以上にしてください';
  if(/valid email/i.test(m))return '有効なメールアドレスを入力してください';
  return m;
}

function signOut(){
  if(!confirm('サインアウトしますか？'))return;
  // Direct localStorage clear - most reliable, no Supabase calls
  Object.keys(localStorage).filter(k=>k.includes('sb-')||k.includes('supabase')).forEach(k=>localStorage.removeItem(k));
  // Fire-and-forget Supabase signout (don't wait for it)
  try{sb.auth.signOut({scope:'local'}).catch(()=>{});}catch(e){}
  location.reload();
}

function showAuth(){
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
}
function showApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
}

// === Render & UI ===
const anyCheck=ds=>Object.values(S.checks[ds]||{}).some(Boolean);
function streak(){let s=0,d=new Date(today);while(anyCheck(dk(d))&&s<365){s++;d=new Date(d.getTime()-864e5);}return s;}
function cd(delta){cur=new Date(cur.getTime()+delta*864e5);render();}
function jumpDay(ts){cur=new Date(ts);render();}
function jumpToday(){cur=new Date(today);closeCal();render();}

function renderWeek(){
  const sun=new Date(cur);sun.setDate(cur.getDate()-cur.getDay());
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(sun.getTime()+i*864e5),ds=dk(d);
    const isCur=d.getTime()===cur.getTime(),isToday=d.getTime()===today.getTime();
    const any=anyCheck(ds);
    const allDone=any&&allTasksToday(d.getDay()).every(t=>(S.checks[ds]||{})[t.id]);
    let cls='week-num'+(allDone?' all':any?' has':'');
    if(isCur&&!allDone)cls+=' cur';
    else if(isToday&&!isCur)cls+=' today';
    html+=`<div class="week-col" onclick="jumpDay(${d.getTime()})"><div class="week-dow">${DOW[d.getDay()]}</div><div class="${cls}">${d.getDate()}</div></div>`;
  }
  document.getElementById('wr').innerHTML=html;
}

function toggle(id){
  const ds=dk(cur);
  if(!S.checks[ds])S.checks[ds]={};
  S.checks[ds][id]=!S.checks[ds][id];
  save();render();
}

function delTask(id){
  if(!confirm('このタスクを削除しますか？\n（過去のチェック記録もすべて消えます）'))return;
  S.customTasks=S.customTasks.filter(t=>t.id!==id);
  Object.keys(S.checks).forEach(ds=>{if(S.checks[ds]&&S.checks[ds][id]!==undefined)delete S.checks[ds][id];});
  save();render();
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderTasks(){
  const ds=dk(cur),c=S.checks[ds]||{},dow=cur.getDay();
  const card=(t,custom)=>{
    const name=t.label||t.name;
    const freq=t.freq||(t.type==='daily'?'毎日':t.type==='weekly'?'週':'随時');
    return `<div class="task-card" onclick="toggle('${t.id}')">
      <div class="dot dot-${t.dot}"></div>
      <div class="task-circle${c[t.id]?' done-'+t.dot:''}"></div>
      <span class="task-name${c[t.id]?' done':''}">${escapeHtml(name)}</span>
      <span class="task-freq">${escapeHtml(freq)}</span>
      ${custom?`<button class="task-del" onclick="event.stopPropagation();delTask('${t.id}')" title="削除">×</button>`:''}
    </div>`;
  };
  const dailyList=[...builtinDaily(dow).map(t=>[t,false]),...customDaily().map(t=>[t,true])];
  const weeklyList=[...(dow===4?WEEKLY.map(t=>[t,false]):[]),...customWeekly(dow).map(t=>[t,true])];
  const adhocList=[...ADHOC.map(t=>[t,false]),...customAdhoc().map(t=>[t,true])];
  let h='';
  if(dailyList.length)h+=`<div class="sec-label">毎日</div>${dailyList.map(([t,cu])=>card(t,cu)).join('')}`;
  if(weeklyList.length)h+=`<div class="sec-label">週1（${DOW[dow]}曜）</div>${weeklyList.map(([t,cu])=>card(t,cu)).join('')}`;
  if(adhocList.length)h+=`<div class="sec-label">随時</div>${adhocList.map(([t,cu])=>card(t,cu)).join('')}`;
  document.getElementById('tc').innerHTML=h;
}

function toggleAddForm(){
  const form=document.getElementById('add-form'),btn=document.getElementById('addToggleBtn');
  if(form.style.display==='none'){
    form.style.display='flex';btn.style.display='none';
    document.getElementById('at-name').value='';
    formType='daily';formDays=[false,false,false,false,false,false,false];formColor='violet';
    setFreq('daily');renderColors();
    document.querySelectorAll('.dow-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('at-name').focus();
  }else{
    form.style.display='none';btn.style.display='block';
  }
}
function setFreq(type){
  formType=type;
  document.querySelectorAll('#at-freq .freq-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
  document.getElementById('at-days').style.display=type==='weekly'?'flex':'none';
}
function toggleDow(d){
  formDays[d]=!formDays[d];
  document.querySelector(`.dow-btn[data-d="${d}"]`).classList.toggle('active',formDays[d]);
}
function renderColors(){
  document.getElementById('at-colors').innerHTML=COLORS.map(c=>
    `<div class="color-sw${c.key===formColor?' active':''}" style="background:${c.val}" onclick="pickColor('${c.key}')"></div>`
  ).join('');
}
function pickColor(k){formColor=k;renderColors();}
function addTask(){
  const name=document.getElementById('at-name').value.trim();
  if(!name){alert('タスク名を入力してください');return;}
  const task={id:'c'+Date.now(),name,type:formType,dot:formColor};
  if(formType==='weekly'){
    if(!formDays.some(Boolean)){alert('曜日を1つ以上選択してください');return;}
    task.days=formDays.slice();
    task.freq='週'+formDays.filter(Boolean).length;
  }else if(formType==='daily'){task.freq='毎日';}
  else{task.freq='随時';}
  S.customTasks.push(task);
  save();toggleAddForm();render();
}

function saveR(){
  const inp=document.getElementById('ri'),v=inp.value.trim();if(!v)return;
  const ds=dk(cur);if(!S.research[ds])S.research[ds]=[];
  S.research[ds].push({id:Date.now(),text:v});
  inp.value='';save();renderR();
}
function delR(id){
  const ds=dk(cur);
  if(S.research[ds])S.research[ds]=S.research[ds].filter(x=>x.id!==id);
  save();renderR();
}
function renderR(){
  const items=S.research[dk(cur)]||[];
  document.getElementById('si').innerHTML=items.map(x=>
    `<div class="saved-item"><span class="si-text">${escapeHtml(x.text)}</span><button class="del" onclick="delR(${x.id})">×</button></div>`
  ).join('');
}

function toggleN(){const ds=dk(cur);S.noteOpen[ds]=!S.noteOpen[ds];applyNoteState();}
function saveN(){const ds=dk(cur);S.notes[ds]=document.getElementById('na').value;S.noteOpen[ds]=false;save();applyNoteState();}
function applyNoteState(){
  const ds=dk(cur),open=!!S.noteOpen[ds];
  document.getElementById('ns').style.display=open?'block':'none';
  document.getElementById('nt').textContent=(open?'－':'＋')+' 今日のひとこと';
  if(open)document.getElementById('na').value=S.notes[ds]||'';
}

function openCal(){calCur=new Date(cur.getFullYear(),cur.getMonth(),1);document.getElementById('cal-overlay').style.display='flex';renderCalGrid();}
function closeCal(){document.getElementById('cal-overlay').style.display='none';}
function calMonth(delta){calCur=new Date(calCur.getFullYear(),calCur.getMonth()+delta,1);renderCalGrid();}
function renderCalGrid(){
  const y=calCur.getFullYear(),m=calCur.getMonth();
  document.getElementById('cal-title').textContent=`${y}年${m+1}月`;
  const firstDow=new Date(y,m,1).getDay();
  const start=new Date(y,m,1-firstDow);
  let html='';
  for(let i=0;i<42;i++){
    const d=new Date(start.getTime()+i*864e5);
    if(i>=35&&d.getMonth()!==m)break;
    const inMonth=d.getMonth()===m,ds=dk(d);
    const isToday=d.getTime()===today.getTime(),isCur=d.getTime()===cur.getTime();
    const any=anyCheck(ds);
    const allDone=any&&allTasksToday(d.getDay()).every(t=>(S.checks[ds]||{})[t.id]);
    let cls='cal-cell';
    if(!inMonth)cls+=' dim';
    if(allDone)cls+=' all';
    else if(any)cls+=' has';
    if(isToday)cls+=' today';
    if(isCur)cls+=' cur';
    html+=`<div class="${cls}" onclick="jumpDay(${d.getTime()});closeCal()">${d.getDate()}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`tracker-backup-${dk(new Date())}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!confirm('現在のデータを上書きしてインポートしますか？'))return;
      S=data;sanitizeS();save();render();alert('インポートしました');
    }catch(err){alert('読み込みに失敗しました');}
  };
  r.readAsText(f);e.target.value='';
}

function render(){
  const t=new Date();t.setHours(0,0,0,0);
  if(t.getTime()!==today.getTime())today=t;
  const isToday=cur.getTime()===today.getTime();
  document.getElementById('nd').textContent=`${cur.getMonth()+1}月${cur.getDate()}日（${DOW[cur.getDay()]}）${isToday?' 今日':''}`;
  document.getElementById('snum').textContent=streak();
  renderWeek();renderTasks();renderR();applyNoteState();
}

// === Init ===
async function init(){
  loadLocal();

  // Listen for auth changes
  sb.auth.onAuthStateChange(async (event,session)=>{
    if(session?.user){
      currentUser=session.user;
      document.getElementById('user-email').textContent=session.user.email||'';
      showApp();
      await pullFromCloud();
      render();renderColors();
    }else{
      currentUser=null;
      showAuth();
    }
  });

  // Initial check
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    currentUser=session.user;
    document.getElementById('user-email').textContent=session.user.email||'';
    showApp();
    await pullFromCloud();
    render();renderColors();
  }else{
    showAuth();
  }
}

// Event listeners
document.getElementById('ri').addEventListener('keydown',e=>{if(e.key==='Enter')saveR();});
document.getElementById('auth-email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('auth-pw').focus();});
document.getElementById('auth-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCal();});

// Pull on focus (catch changes from other devices)
window.addEventListener('focus',()=>{if(currentUser)pullFromCloud().then(render);});

// Online/offline
window.addEventListener('online',()=>{if(currentUser)pushToCloudNow();});
window.addEventListener('offline',()=>setSync('offline'));

// Daily refresh
setInterval(()=>{
  const t=new Date();t.setHours(0,0,0,0);
  if(t.getTime()!==today.getTime()){today=t;render();}
},60*1000);

document.getElementById('auth-submit').dataset.mode='signin';
init();
</script>
